<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#112f32"><title>我的生活城 · 镜头漫游版</title><meta name="description" content="轻推镜头，走进日常。近景节点、随景记忆与相机式时间拨杆。虚构数据交互原型。">
<style>
:root{color-scheme:dark;--gold:#f3d19b;--text:#fff1d7;--sub:#a6bdad;--bg:#112f32}*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#082328;color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}.track{height:440svh;max-width:500px;margin:auto;position:relative}.screen{position:sticky;top:0;height:100svh;min-height:510px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}.bar{display:flex;align-items:center;justify-content:space-between;padding:calc(9px + env(safe-area-inset-top)) 20px 4px;flex-shrink:0}.brand{font-size:11px;color:#c5d7ba;letter-spacing:1px}.brand b{padding:3px 5px;border-radius:5px;background:#f9d879;color:#304531;margin-right:7px;letter-spacing:0}.skip{min-height:36px;border:0;background:none;font-size:11px;color:#c8d5bb}.stage{position:relative;flex:1;min-height:220px;overflow:hidden;touch-action:pan-y;background:radial-gradient(ellipse at 51% 56%,#3b5b4f 0,#1d3c3b 45%,#112f32 82%)}.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden}.floor-fade{position:absolute;inset:auto 0 0;height:38px;background:linear-gradient(transparent,#112f32);pointer-events:none}.narrative{position:absolute;left:0;top:0;width:calc(100% - 42px);max-width:380px;pointer-events:none;will-change:transform,opacity;z-index:2}.kicker{font-size:10px;color:#d7be8e;letter-spacing:1.1px}.narrative h1{font-weight:500;font-size:27px;line-height:1.35;letter-spacing:-.5px;margin:6px 0 0;text-shadow:0 2px 15px #112f32}.detail-label{position:absolute;width:calc(100% - 46px);max-width:372px;pointer-events:none;will-change:transform,opacity;z-index:2}.detail-label strong{font-size:15px;font-weight:500;color:#f0d5a4;display:block}.quote{font-size:13px;color:#d2dfc6;margin-top:7px}.dates{font-size:10px;color:#a1bca5;margin-top:5px;line-height:1.7}.benefit{display:inline-block;margin-top:8px;border:1px solid #b7cd9a38;background:#25473cba;padding:4px 9px;border-radius:20px;font-size:10px;color:#e1d7b2}.benefit:empty{display:none}.scene-connector{pointer-events:none;z-index:1}.scene-connector path{stroke:#d4c89c;stroke-width:1;fill:none;opacity:.48}.scene-connector circle{fill:#e5d1a2}.end-options{position:absolute;bottom:5px;left:23px;right:23px;display:flex;justify-content:center;gap:12px;z-index:3}.end-options[hidden]{display:none}.end-options button{min-height:40px;padding:8px 12px;font-size:11px;border:1px solid #9ab29b44;background:#18382f;border-radius:20px;color:#e3dbc0}.dock{position:relative;flex-shrink:0;background:linear-gradient(#112f32,#0a2327);padding:7px 22px max(12px,env(safe-area-inset-bottom));z-index:4;border-top:1px solid #c9e0b019}.journey-status{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-bottom:8px;font-size:10px;color:#a3b9a8}.journey-status #hint{color:#d0c5a0}.steps{display:flex;gap:4px}.steps i{width:12px;height:2px;background:#66816c}.steps i.active{background:var(--gold);width:22px}.dial-title{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#8eac99;gap:8px}.dial-title strong{font-size:12px;color:#efdbb6;font-weight:500}.dial{position:relative;height:42px;border-radius:9px;margin-top:6px;background:linear-gradient(#071d20,#183638 50%,#0b2326);box-shadow:inset 0 2px 5px #0007,0 1px #9ab58d20;border:1px solid #79907932}.tick-strip{position:absolute;inset:9px 14px;background:repeating-linear-gradient(90deg,#a8b59a50 0 1px,transparent 1px 9px);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}.lever{position:absolute;top:4px;left:18px;transform:translateX(-50%);width:32px;height:32px;border-radius:6px;background:linear-gradient(100deg,#c7b080,#ffe5af 45%,#b69c6e);box-shadow:0 2px 5px #0006,inset 0 1px #fff8;pointer-events:none}.lever:after{content:"";position:absolute;inset:7px 10px;background:repeating-linear-gradient(90deg,#755f4266 0 1px,transparent 1px 3px)}.dial input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;touch-action:pan-y}.dial:focus-within{outline:2px solid var(--gold);outline-offset:3px}.dial-labels{display:flex;justify-content:space-between;margin-top:1px}.dial-labels button{border:0;background:none;color:#93ae9d;font-size:11px;padding:5px 0;min-width:48px;min-height:30px}.dial-labels button[aria-pressed=true]{color:#f3d19b}.footnote{font-size:9px;color:#6e9583;text-align:center;margin-top:1px}.building{cursor:pointer}.reveal-label{fill:#f3e5c6;font:11px sans-serif;text-anchor:middle}.screen.focusing .stage{filter:brightness(.85)}.screen.focusing .stage{transition:filter .16s}.dialog{position:fixed;inset:auto 0 0;margin:0 auto;width:min(100%,500px);max-width:500px;max-height:78dvh;border:0;border-radius:23px 23px 0 0;padding:0;background:#fcfaf1;color:#304736;color-scheme:light}.dialog::backdrop{background:#041d257e;backdrop-filter:blur(3px)}.dh{position:sticky;top:0;background:#fcfaf1;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #e1e5d7;font-size:11px;color:#71816c}.close{border:0;background:none;color:#4f6b52;min-width:44px;min-height:44px;font-size:24px}.db{padding:15px 22px 25px}.db h2{font-size:23px;font-weight:500;margin:0 0 12px}.db p{font-size:13px;line-height:1.8}.db small{font-size:11px;color:#7d8a76}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e2e6d8;font-size:12px}.row small{display:block}.places{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.places button{min-height:42px;padding:8px 12px;border:1px solid #d7dfcc;border-radius:22px;background:none;color:#49684a;font-size:12px}.db a{color:#526d49}.dialog .quote{color:#546e50;background:#edf0e3;padding:12px;border-radius:10px}.dialog .quote small{display:block}.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}@media(min-width:540px){.screen{box-shadow:0 0 90px #0003}.dialog{bottom:15px;border-radius:23px}}@media(max-height:720px){.narrative h1{font-size:24px}.detail-label strong{font-size:13px}.quote{font-size:12px;margin-top:5px}.benefit{margin-top:5px}.dock{padding-top:5px;padding-bottom:8px}.bar{padding-top:5px}.journey-status{margin-bottom:5px}.dial{height:36px}.lever{height:26px}.stage{min-height:195px}.footnote{font-size:9px}.dates{font-size:9px}.dial-labels button{min-height:28px}}@media(max-width:350px){.narrative h1{font-size:23px}.dock{padding-left:18px;padding-right:18px}.bar{padding-left:18px;padding-right:18px}.narrative{width:calc(100% - 36px)}.detail-label{width:calc(100% - 36px)}.dial-title{font-size:9px}.kicker{font-size:9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.detail-label{padding:8px 10px;background:linear-gradient(100deg,#102e32bf,#102e3220);border-radius:10px;text-shadow:0 1px 5px #102e32}.narrative{text-shadow:0 2px 12px #0b2b30}
</style></head><body>
<main class="track"><section class="screen">
<header class="bar"><span class="brand"><b>美团</b>我的生活城</span><button class="skip" id="skip">看全貌 ↘</button></header>
<div class="stage" aria-label="上下滑动漫游，轻推后自然前进，反向滑动回看">
<svg id="world" viewBox="0 0 760 585" role="img" aria-label="生活城市近景漫游，内容随镜头出现，结尾拉远。">%%CITY%%</svg>
<svg class="scene-connector" aria-hidden="true"><path id="leader"/><circle id="anchor" r="2.5"/></svg>
<section class="narrative" aria-live="polite"><div class="kicker" id="kicker"></div><h1 id="title"></h1></section>
<section class="detail-label" aria-live="polite"><strong id="stat"></strong><div class="quote" id="quote"></div><div class="dates" id="dates"></div><div class="benefit" id="benefit"></div></section>
<div class="floor-fade"></div><div class="end-options" hidden><button id="facts">查看记录依据</button><button id="restart">再走一遍 ↺</button></div>
</div>
<footer class="dock"><div class="journey-status"><span id="hint">↑ 轻推画面，走进日常</span><div class="steps" aria-hidden="true"><i></i><i></i><i></i><i></i></div><span id="chapter-name"></span></div><div class="dial-title"><span>时间取景 <strong id="scale-name">近一月</strong></span><span id="period"></span></div><div class="dial"><div class="tick-strip"></div><div class="lever"></div><input id="time-dial" type="range" min="0" max="2" value="0" step="0.01" aria-label="时间取景拨杆，0近一月，1近半年，2近一年" aria-valuetext="近一月"></div><div class="dial-labels"><button data-range="month" aria-pressed="true">近一月</button><button data-range="half" aria-pressed="false">近半年</button><button data-range="year" aria-pressed="false">近一年</button></div><div class="footnote">虚构记录 · 主题漫游，非实际地理或出行路线</div></footer>
</section></main><dialog class="dialog" id="detail"><header class="dh"><span id="dialog-label"></span><button class="close" aria-label="关闭详情">×</button></header><div class="db" id="dialog-body"></div></dialog>
