function draw(){const index=Math.min(3,Math.floor(p*4)),u=clamp(p*4-index),ch=chapters[index];if(chapter!==index){chapter=index;$('#kicker').textContent=ch.k;$('#title').innerHTML=ch.title;$('#description').textContent=ch.desc;$('#memory').textContent=ch.quote;$('#evidence').textContent=ch.evidence;$('#step-name').textContent=['新相遇','又见面','另一段日常','我的生活城'][index];}
let cx=ch.x,cy=ch.y,w=ch.w;if(index===0){w=350-(350-ch.w)*smooth(u/.35);}else{const prev=chapters[index-1],t=smooth(u/.25);cx=prev.x+(ch.x-prev.x)*t;cy=prev.y+(ch.y-prev.y)*t;w=prev.w+(ch.w-prev.w)*t;}if(reduce){cx=ch.x;cy=ch.y;w=ch.w;}$('#world').setAttribute('viewBox',`${cx-w/2} ${cy-w/2} ${w} ${w}`);
stores.forEach(s=>{const before=first(s.id)<spans[range].start,ci=chapters.findIndex(c=>c.ids.includes(s.id));let g=before?1:ci<0?smooth((p-.8)/.14):smooth((p*4-ci-.12)/.48);if(reduce&&!before)g=g>.5?1:0;const el=dom[s.id],highlight=ch.ids.includes(s.id),end=index===3;el.el.style.opacity=g*(highlight||end?1:before?.47:.6);el.model.style.transform=`translateY(${(1-g)*35}px) scaleY(${.04+g*.96})`;el.label.style.opacity=highlight?clamp((g-.7)/.3):end?clamp((p-.89)/.07):0;el.glow.style.opacity=highlight&&index===1?smooth((u-.2)/.3)*.5:0;el.windows.forEach((window,i)=>window.setAttribute('fill',index===1&&s.id==='coffee'&&u<i/12?'#8c9070':'#ffe5a6'));el.el.style.pointerEvents=p>.96?'auto':'none';});
document.querySelectorAll('.cup').forEach((c,i)=>{const v=smooth((p-.3-i*.13/Math.max(1,coffeeRows.length))/.025);c.style.opacity=p<.54?v:Math.max(0,1-(p-.54)*15);c.style.transform=`translateY(${(1-v)*-15}px)`;});
if(index===1){const count=Math.min(coffeeRows.length,Math.floor(clamp((u-.2)/.5)*coffeeRows.length));$('#memory').textContent=count?`${spans[range].label}，你选择过它 ${count} 次。`:'熟悉的小店，正为你重新亮灯。';$('#evidence').textContent=count?coffeeRows.slice(0,count).map(e=>fmt(e.t).slice(5)).join(' · ')+' · 已完成的咖啡记录':ch.evidence;}
const a=index===0?{x:ch.x-80,y:ch.y+85}:chapters[index-1],target=ch;const road=$('#road');road.setAttribute('d',`M${a.x} ${a.y+30}Q${(a.x+target.x)/2} ${Math.max(a.y,target.y)+120} ${target.x} ${target.y+40}`);let len=road.getTotalLength(),travel=smooth(u/.55);road.style.strokeDasharray=len;road.style.strokeDashoffset=len*(1-travel);road.style.opacity=index===3?0:.8;const pt=road.getPointAtLength(len*travel);$('#traveler').setAttribute('cx',pt.x);$('#traveler').setAttribute('cy',pt.y);$('#traveler').style.opacity=index===3?0:1;$('#connection').style.opacity=range==='half'&&index===0?clamp((u-.45)/.25):0;
$('#badge').textContent=index===0?'新经历 · 从这里生长':index===1?'同一个地方 · 积累更多回忆':index===2?'一段经历 · 一处新的记忆':'镜头拉远 · 生活全貌';$('#progress').style.width=p*100+'%';$('#percent').textContent=Math.round(p*100)+'%';$('#end-actions').hidden=p<.97;$('#gesture').hidden=p>=.97;$('#map-note').textContent=p>=.97?'轻点地标重温 · 也可以继续查看记忆依据':index===0&&range==='half'?'连接同日记录，不代表实际行走路线':'反向滑动，就能回到刚才的片段';$('#skip').textContent=p>.97?'回到起点 ↖':'直接看全城 ↘';}
function measure(){const track=$('.track'),height=track.offsetHeight-$('.screen').offsetHeight;p=clamp((window.scrollY-track.offsetTop)/Math.max(1,height));draw();}
function scrollToProgress(v){const track=$('.track');window.scrollTo({top:track.offsetTop+v*(track.offsetHeight-$('.screen').offsetHeight),behavior:reduce?'instant':'smooth'});}
function schedule(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;measure();});}
window.addEventListener('scroll',schedule,{passive:true});window.addEventListener('resize',schedule);$('#range').onchange=e=>{range=e.target.value;p=0;configure();window.scrollTo({top:$('.track').offsetTop,behavior:'instant'});};$('#begin').onclick=()=>scrollToProgress(p<.04?.17:Math.min(1,(Math.floor(p*4)+1)/4+.12));$('#skip').onclick=()=>scrollToProgress(p>.97?0:1);$('#restart').onclick=()=>scrollToProgress(0);
function summary(){const rows=currentRows.filter(e=>e.off>0);$('#dialog-label').textContent=fmt(spans[range].start)+' — '+fmt(END);$('#dialog-body').innerHTML=`<h2>这一阶段看到这里。<br>记忆，还可以继续靠近。</h2><p>${fresh.length} 个新地方，${again.length} 个熟悉的地方。${currentRows.length} 条有效记录，构成了这段旅程。</p><div class="places">${ids.map(id=>`<button data-detail="${id}">${get(id).name}</button>`).join('')}</div><h2>会员足迹 · ¥${amount}</h2><small>${uses} 次实际使用，不计未使用券或预估价值。</small>${rows.map(e=>`<div class="row"><span>${get(e.s).name}<small>${fmt(e.t)} · ${e.item}</small></span><span>¥${e.off}</span></div>`).join('')}<p><a href="./journey.html">查看时间总览版</a> · <a href="./index.html">查看初版</a></p><small>所有记录、评价、权益金额均为虚构示例。按生活主题组织片段，不表示消费时间连续或实际到访路线。</small>`;if(!$('#detail').open)$('#detail').showModal();}
function showPlace(id){const s=get(id),rows=currentRows.filter(e=>e.s===id),q=[...rows].reverse().find(e=>e.q),old=events.filter(e=>e.s===id&&e.t<spans[range].start);$('#dialog-label').textContent='这一阶段 · '+s.name;$('#dialog-body').innerHTML=`<h2>${s.name}</h2><p>本阶段 ${rows.length} 条记录，此前 ${old.length} 条。重复选择积累在同一个地方，不重复造楼。</p>${q?`<div class="quote">${q.q}<small>${fmt(q.t)} · 示例用户原话</small></div>`:''}${rows.map(e=>`<div class="row"><span>${e.item}<small>${fmt(e.t)}</small></span><span>${e.off?'省 ¥'+e.off:''}</span></div>`).join('')}${rows.length?'':'<p>这段时间没有新记录，旧的记忆仍然保留。</p>'}<div class="places"><button id="back-summary">回到阶段总结</button></div>`;if(!$('#detail').open)$('#detail').showModal();}
$('#facts').onclick=summary;$('.close').onclick=()=>$('#detail').close();document.addEventListener('click',e=>{const b=e.target.closest('[data-detail]'),s=e.target.closest('[data-place]');if(b)showPlace(b.dataset.detail);else if(s&&p>.96)showPlace(s.dataset.place);if(e.target.closest('#back-summary'))summary();});$('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const r=$('#detail').getBoundingClientRect();if(e.clientY<r.top||e.clientX<r.left||e.clientX>r.right)$('#detail').close();}});
configure();measure();
})();
</script></body></html>
