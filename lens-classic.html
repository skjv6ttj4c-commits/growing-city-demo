function travelHeight(){return Math.max(1,$('.track').offsetHeight-$('.screen').offsetHeight);}
function readTarget(){return clamp((window.scrollY-$('.track').offsetTop)/travelHeight());}
function wake(){if(!raf)raf=requestAnimationFrame(tick);}
function tick(now){raf=0;const delta=Math.min(40,last?now-last:16);last=now;p=reduce?target:p+(target-p)*(1-Math.exp(-delta/55));if(Math.abs(p-target)<.00015)p=target;draw();if(p!==target)wake();else last=0;}

window.addEventListener('scroll',()=>{target=readTarget();wake();if(!snapRunning)settle();},{passive:true});

$('#time-dial').addEventListener('input',e=>{rangeLock=true;clearTimeout(settleTimer);updateDial(+e.target.value);$('#hint').textContent='松手切换范围，保留仍有记录的当前地点';});$('#time-dial').addEventListener('change',e=>switchRange(Object.keys(spans)[Math.round(+e.target.value)]));
